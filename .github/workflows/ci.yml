name: AfroMercado CI / CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  backend-checks:
    name: Backend — Prisma, Tests & Migraciones DDL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: afromercado
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: afromercado/package-lock.json

      - name: Instalar Dependencias
        run: npm ci

      - name: Generar Prisma Client
        run: npx prisma generate

      - name: Ejecutar Lint Backend
        run: npm run lint

      - name: Ejecutar Pruebas Vitest (Aisladas & Concurrencia)
        run: npm run test:vitest

      - name: Ejecutar Pruebas Legacy (Integración Backend)
        run: npm test

  frontend-checks:
    name: Frontend — Linting, Typecheck & Build Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: afromercado-web
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: afromercado-web/package-lock.json

      - name: Instalar Dependencias
        run: npm ci

      - name: Ejecutar ESLint
        run: npm run lint

      - name: Typecheck TypeScript (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Construir Aplicación Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api
          NODE_ENV: production
